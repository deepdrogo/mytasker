# MyTasker.io - nginx vhost (CloudPanel-managed TLS). Static SPA + reverse proxy to uvicorn (127.0.0.1:8015).
# Install: cp deploy/nginx/mytasker.io.conf /etc/nginx/sites-enabled/mytasker.io.conf && nginx -t && systemctl reload nginx

upstream mytasker_backend {
  server 127.0.0.1:8015;
  keepalive 32;
}

map $http_upgrade $mytasker_connection {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/mytasker.io.key;
  ssl_certificate /etc/nginx/ssl-certificates/mytasker.io.crt;
  server_name www.mytasker.io;
  return 301 https://mytasker.io$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/mytasker.io.key;
  ssl_certificate /etc/nginx/ssl-certificates/mytasker.io.crt;
  server_name mytasker.io www1.mytasker.io;

  root /home/mytasker/htdocs/mytasker.io/frontend/dist;
  index index.html;

  access_log /home/mytasker/logs/nginx/access.log main;
  error_log /home/mytasker/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  client_max_body_size 5m;

  # Security headers (global_settings is intentionally NOT included: it sets SAMEORIGIN + same-origin referrer,
  # we want DENY and a CSP tuned to this SPA).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://mytasker.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # ---- API ---------------------------------------------------------------
  location /api/ {
    proxy_pass http://mytasker_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  location = /health/ {
    proxy_pass http://mytasker_backend;
    proxy_set_header Host $host;
    access_log off;
  }

  # ---- WebSockets --------------------------------------------------------
  location /ws/ {
    proxy_pass http://mytasker_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mytasker_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # ---- Django admin + its static files -----------------------------------
  location /admin/ {
    proxy_pass http://mytasker_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Admin needs inline scripts/styles; relax CSP for this path only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
  }

  location /backend-static/ {
    alias /home/mytasker/htdocs/mytasker.io/backend/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ---- SPA ---------------------------------------------------------------
  # Hashed build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(ico|svg|png|webp|woff2?|txt|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }

  # Everything else is the SPA shell; never cache index.html so deploys are instant.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://mytasker.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  }
}
